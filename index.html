@media (max-width: 560px) { #brand { display: none; } }
@media (prefers-reduced-motion: reduce) { #panel.enter { animation: none; } }

  kitchen.position.set(KITCHEN.x, 0, KITCHEN.z); scene.add(kitchen);
  const chim = box(.5, 1.5, .5, mat(0x3a332d)); chim.position.set(1.6, 3.7, -.8); kitchen.add(chim);
  kitchen.updateMatrixWorld(true);
  const chimTop = new THREE.Vector3(1.6, 4.5, -.8).applyMatrix4(kitchen.matrixWorld);
  const smokeM = new THREE.SpriteMaterial({ map: T.flake, color: 0xaeb3b6, transparent: true, opacity: .5, depthWrite: false });

    { type: 'win', x: 2.6, w: .85, h: .85, y: 2.1 },

function register(obj, step) { obj.traverse(m => { if (m.isMesh) { m.userData.step = step; pickables.push(m); } }); }

/* where the girl stands for each step */
function spot(i) {
  if (i <= 0) return new THREE.Vector3(KITCHEN.x + .1, .24, KITCHEN.z + 3.5);
  if (i >= 7) return new THREE.Vector3(MAIN.x, .24, MAIN.z + 3.4);

  return new THREE.Vector3(x, .3, z);
}

/* ---------- camera ---------- */
let tween = null, hop = null, step = 0, cvOpen = false;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function camFor(i) {

    const half = Math.atan(Math.tan(THREE.MathUtils.degToRad(16)) * aspect);
    const fitW = 46 / avail / 2 / Math.tan(half);
    const fitH = narrow ? 30 / .5 / 2 / Math.tan(THREE.MathUtils.degToRad(16)) : 0;
    const d = THREE.MathUtils.clamp(Math.max(fitW, fitH), 45, 200);
    const target = new THREE.Vector3(0, -1.2, 0);
    const pos = target.clone().add(new THREE.Vector3(0, d * .46, d * .89));
    return { pos, target, sx: narrow ? 0 : (cvOpen ? -.21 : .19), sy: narrow ? (cvOpen ? .25 : .2) : 0 };
  }
  const s = spot(i);
  const target = new THREE.Vector3(s.x, 1.3, s.z - 1.2);
  if (i === 1) target.set(KITCHEN.x + .6, 1.6, KITCHEN.z + 1.6);
  if (i === 7) target.set(MAIN.x, 2.0, MAIN.z + 1.2);

function go(i, instant) {

document.getElementById('pPrev').onclick = () => go(step - 1);
document.getElementById('pNext').onclick = () => go(step + 1);
document.getElementById('bWr').onclick = () => setOverlay(overlayKind === 'writing' ? null : 'writing');
document.getElementById('sSummer').onclick = () => setSeason('summer');
document.getElementById('sWinter').onclick = () => setSeason('winter');
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(step + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(step - 1); }
  if (e.key === 'Escape' && cvOpen) setOverlay(null);
});
let wheelAcc = 0, wheelLock = 0;
addEventListener('wheel', e => {
  if (e.target.closest && e.target.closest('#panel')) return;
  const now = performance.now(); if (now < wheelLock) return;
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) > 60) { go(step + Math.sign(wheelAcc)); wheelAcc = 0; wheelLock = now + 900; }
}, { passive: true });

function setSeason(s) {
  season = s;
  winterOnly.forEach(o => o.visible = s === 'winter');
  summerOnly.forEach(o => o.visible = s === 'summer');
  document.body.classList.toggle('summer', s === 'summer');
  hemi.intensity = s === 'winter' ? .5 : .55;
  sun.intensity = s === 'winter' ? 1.45 : 1.55;
  sun.color.setHex(s === 'winter' ? 0xffeedd : 0xffc98c);
  hemi.color.setHex(s === 'winter' ? 0xcfdcf0 : 0xb9cce0);
  document.getElementById('sWinter').setAttribute('aria-pressed', s === 'winter');
  document.getElementById('sSummer').setAttribute('aria-pressed', s === 'summer');
  if (typeof applySoundMix === 'function') applySoundMix();
}


/* ---------- sound, synthesised in the browser: rain or wind, the stove, the chickens ---------- */
let season = 'summer';
const Sound = { ctx: null, on: false };
function startSound() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = Sound.ctx || (Sound.ctx = new AC());
  ctx.resume();
  if (Sound.master) { Sound.master.gain.setTargetAtTime(.9, ctx.currentTime, .4); applySoundMix(); return; }
  const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
  master.gain.setTargetAtTime(.9, ctx.currentTime, .6);
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const loop = () => { const src = ctx.createBufferSource(); src.buffer = nb; src.loop = true; src.start(); return src; };
  const filt = (type, f, q = .7) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
  const gain = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
  // rain: bright noise
  Sound.rain = gain(0); loop().connect(filt('highpass', 1200)).connect(filt('lowpass', 7000)).connect(Sound.rain).connect(master);
  // wind: a band of noise that slowly rises and falls
  const wf = filt('bandpass', 420, .8), lfo = ctx.createOscillator(), lfoG = gain(260);
  lfo.frequency.value = .07; lfo.connect(lfoG).connect(wf.frequency); lfo.start();
  Sound.wind = gain(0); loop().connect(wf).connect(Sound.wind).connect(master);
  // stove: a low rumble plus crackles
  Sound.fire = gain(0); loop().connect(filt('lowpass', 170)).connect(Sound.fire).connect(master);
  Sound.crackle = gain(0); Sound.crackle.connect(master);
  Sound.master = master; Sound.nb = nb;
  crackleLoop(); cluckLoop(); applySoundMix();
}
function crackle() {
  const ctx = Sound.ctx, t = ctx.currentTime, src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = Sound.nb; bp.type = 'bandpass'; bp.frequency.value = 1500 + Math.random() * 2500; bp.Q.value = 1.5;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.4 + Math.random() * .5, t + .003); g.gain.exponentialRampToValueAtTime(.001, t + .04 + Math.random() * .07);
  src.connect(bp).connect(g).connect(Sound.crackle); src.start(t, Math.random() * 1.5, .12);
}
function crackleLoop() {
  if (Sound.on) { crackle(); if (Math.random() < .3) setTimeout(crackle, 45); }
  setTimeout(crackleLoop, 90 + Math.random() * 450);
}
function cluck() {
  const ctx = Sound.ctx, n = 1 + Math.floor(Math.random() * 3);
  for (let k = 0; k < n; k++) {
    const t = ctx.currentTime + k * .17, o = ctx.createOscillator(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(540 + Math.random() * 90, t); o.frequency.exponentialRampToValueAtTime(310, t + .09);
    bp.type = 'bandpass'; bp.frequency.value = 1150; bp.Q.value = 3;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .012); g.gain.exponentialRampToValueAtTime(.001, t + .12);
    o.connect(bp).connect(g).connect(Sound.master); o.start(t); o.stop(t + .14);
  }
}
function cluckLoop() {
  if (Sound.on) cluck();
  setTimeout(cluckLoop, 5000 + Math.random() * 9000);
}
function applySoundMix() {
  if (!Sound.master) return;
  const t = Sound.ctx.currentTime, w = season === 'winter', near = step <= 1 && !cvOpen;
  Sound.rain.gain.setTargetAtTime(w ? 0 : .11, t, .8);
  Sound.wind.gain.setTargetAtTime(w ? .28 : 0, t, .8);
  Sound.fire.gain.setTargetAtTime(near ? .55 : .14, t, .8);
  Sound.crackle.gain.setTargetAtTime(near ? .22 : .05, t, .8);
}
function setSound(on) {
  Sound.on = on;
  document.getElementById('bSound').setAttribute('aria-pressed', on);
  if (on) startSound();
  else if (Sound.master) Sound.master.gain.setTargetAtTime(0, Sound.ctx.currentTime, .3);
}
document.getElementById('bSound').onclick = () => setSound(!Sound.on);
document.addEventListener('visibilitychange', () => {
  if (!Sound.ctx || !Sound.on) return;
  document.hidden ? Sound.ctx.suspend() : Sound.ctx.resume();
});

/* ---------- pointer ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hoverStep = null;
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.step : null;
}
function bindPointer() {
  const el = renderer.domElement; let down = null;
  el.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; tween = null; });
  el.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || e.buttons) return;
    hoverStep = pick(e); el.style.cursor = hoverStep ? 'pointer' : '';
  });
  el.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if (moved < 6) { const k = pick(e); if (k) go(k); }
  });
}
function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  flyTo(camFor(cvOpen ? 0 : step), true);
}

/* ---------- loop ---------- */
const v = new THREE.Vector3(); let last = performance.now();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (tween) {
    const t = Math.min(1, (now - tween.s) / tween.d), k = ease(t);
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    viewSX = tween.x0 + (tween.x1 - tween.x0) * k; viewSY = tween.y0 + (tween.y1 - tween.y0) * k; applyView();
    if (t >= 1) tween = null;
  }
  controls.update();
  if (hop) {
    const t = Math.min(1, (now - hop.s) / hop.d);
    girl.position.lerpVectors(hop.from, hop.to, ease(t));
    girl.position.y += Math.sin(Math.PI * t) * .7;
    if (t > .5 && !hop.grown) { setAge(hop.age); hop.grown = true; }
    if (t >= 1) hop = null;
  } else if (!reduceMotion) girl.position.y = spot(step).y + Math.abs(Math.sin(now * .002)) * .02;

  rings.forEach((r, k) => {
    const want = r.userData.on ? .55 + Math.sin(now * .003) * .15 : (hoverStep === k + 1 ? .3 : 0);
    r.material.opacity += (want - r.material.opacity) * Math.min(1, dt * 6);
  });
  if (rainLines.visible && !reduceMotion) {
    const a = rainLines.geometry.attributes.position, arr = a.array;
    for (let i = 0; i < arr.length; i += 6) {
      arr[i + 1] -= dt * 8.5; arr[i + 4] -= dt * 8.5; arr[i] -= dt * .35; arr[i + 3] -= dt * .35;
      if (arr[i + 1] < 0) {
        const x = (Math.random() - .5) * (W - 2), z = (Math.random() - .5) * (D - 2), y = 16 + Math.random() * 3;
        arr[i] = x; arr[i + 1] = y; arr[i + 2] = z; arr[i + 3] = x + .025; arr[i + 4] = y + .32; arr[i + 5] = z;
      }
    }
    a.needsUpdate = true;
    ripples.forEach(r => {
      const u = r.userData; u.t += dt * .8;
      if (u.t >= 1) {
        u.t = 0;
        if (Math.random() < .7) { const [px, pz, sx, sz] = u.spots[Math.floor(Math.random() * u.spots.length)], an = Math.random() * 6.28, rad = Math.sqrt(Math.random()) * .85; r.position.set(px + Math.cos(an) * sx * rad, .05, pz + Math.sin(an) * sz * rad); }
        else r.position.set((Math.random() - .5) * 26, .03, (Math.random() - .5) * 11);
      }
      const sc = 1 + u.t * 5; r.scale.set(sc, sc, 1); r.material.opacity = .32 * (1 - u.t);
    });
  }
  if (snowPts.visible && !reduceMotion) {
    const a = snowPts.geometry.attributes.position, arr = a.array;
    for (let i = 0; i < arr.length; i += 3) {
      arr[i + 1] -= dt * (1.2 + (i % 7) * .1);
      arr[i] += Math.sin(now * .0006 + i) * dt * .2;
      if (arr[i + 1] < 0) arr[i + 1] = 18;
    }
    a.needsUpdate = true;
  }
  smoke.forEach(s => {
    s.userData.t = (s.userData.t + dt * (reduceMotion ? 0 : .1)) % 1;
    const t = s.userData.t;
    s.position.copy(s.userData.base).add(v.set(t * 1.4 + Math.sin(t * 6) * .2, t * 4.2, -t * .5));
    const sc = .45 + t * 1.8; s.scale.set(sc, sc, 1);
    s.material.opacity = .5 * (1 - t);
  });
  const w = innerWidth, h = innerHeight;
  tagEls.forEach((el, i) => {
    const show = hoverStep === i && i !== step && i > 0;
    el.classList.toggle('on', show);
    if (!show) return;
    v.copy(spot(i)); v.y += i === 1 || i === 7 ? 4.8 : 1.4; v.project(camera);
    el.style.transform = `translate(${(v.x + 1) / 2 * w + viewSX * w}px, ${(1 - v.y) / 2 * h - viewSY * h}px) translate(-50%, -100%)`;
  });
  renderer.render(scene, camera);
}
